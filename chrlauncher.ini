# Copy from below
[chrlauncher]

# Custom Chromium update URL (string):
ChromiumUpdateUrl=https://github.com/uazo/cromite/releases/latest/download/updateurl.txt

# Command line for Chromium (string):
# Ton of Features: Privacy Hardening, Performance, and Portability
ChromiumCommandLine=--user-data-dir=".\data" --no-default-browser-check --no-first-run --disable-logging --disable-breakpad --disable-component-update --disable-background-networking --disable-features=InterestCohort,Translate,WebRtcHideLocalIpsWithMdns,CalculateNativeWinOcclusion,CertificateTransparencyComponentUpdater --metrics-recording-only --no-pings --password-store=basic --enable-features=WebUIDarkMode --force-dark-mode

# Chromium executable file name (string):
ChromiumBinary=chrome.exe

# Chromium binaries directory (string):
# Relative (to chrlauncher directory) or full path (env. variables supported).
ChromiumDirectory=.\app

# Bring chrlauncher window when download started (boolean)
#
# false	-> don't bring main window to front automatically
# true	-> bring chrlauncher window to front when download started (default)
ChromiumBringToFront=false

# Check for new Chromium version once in X days (integer):
#
# 2	-> check updates once in a X days (default)
# 0	-> disable update checking
# -1	-> force update checking
ChromiumCheckPeriod=-1

# Last cached update checking timestamp (integer):
ChromiumLastCheck=1776997763
